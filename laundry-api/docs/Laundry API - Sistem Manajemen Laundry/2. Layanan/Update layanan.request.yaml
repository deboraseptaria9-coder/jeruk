$kind: http-request
description: ""
url: "{{baseUrl}}/layanan/{{layananId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "harga": 45000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Format JSON standar', () => pm.expect(pm.response.json()).to.have.property('success'));
      pm.test('Harga berubah', () => pm.expect(pm.response.json().data.harga).to.eql(45000));
    language: text/javascript
order: 7000
