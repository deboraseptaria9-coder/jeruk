$kind: http-request
description: ""
url: "{{baseUrl}}/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Format JSON standar', () => pm.expect(pm.response.json()).to.have.property('success'));
      pm.test('Ada total_pesanan', () => pm.expect(pm.response.json().data).to.have.property('total_pesanan'));
    language: text/javascript
order: 1000
